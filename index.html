<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campus Room &amp; Equipment Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24291F; --paper:#ECE8DC; --card:#F7F5EE;
  --brass:#9C6B2E; --brass-light:#C79A56;
  --blueprint:#2B4257; --blueprint-light:#3E5C74;
  --flag:#8C4430; --good:#4B6650; --bad:#A43F32; --neutral:#8A8672;
  --line:#D8D2C0; --line-strong:#B7AF97;
  --tag-ctl:#4B6650;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --ink:#EDEAE0; --paper:#181B15; --card:#20241C;
  --brass:#D3A458; --brass-light:#E4BE7C;
  --blueprint:#4A6C89; --blueprint-light:#5E82A0;
  --line:#33372A; --line-strong:#454B37; --tag-ctl:#7FA187;
  --good:#7FA187; --bad:#D88072; --neutral:#9C9885;
}}
:root[data-theme="dark"]{
  --ink:#EDEAE0; --paper:#181B15; --card:#20241C;
  --brass:#D3A458; --brass-light:#E4BE7C;
  --blueprint:#4A6C89; --blueprint-light:#5E82A0;
  --line:#33372A; --line-strong:#454B37; --tag-ctl:#7FA187;
  --good:#7FA187; --bad:#D88072; --neutral:#9C9885;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.display{font-family:'Fraunces',serif;}
select,input,textarea,button{font-family:inherit;}

header.band{background:var(--blueprint);color:#F3F1E8;padding:calc(18px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) 0;border-bottom:3px solid var(--brass);}
.band-top{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;max-width:1240px;margin:0 auto;}
.band-title{font-size:clamp(19px,2.5vw,26px);font-weight:600;margin:0;}
.band-sub{font-size:12px;color:#C9D3DA;margin-top:3px;}
.mode-toggle{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:3px;overflow:hidden;flex-shrink:0;}
.mode-toggle button{background:transparent;color:#E6EAEC;border:none;padding:8px 13px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.mode-toggle button.active{background:var(--brass);color:#1D1204;}
.mode-toggle button:not(.active):hover{background:rgba(255,255,255,.1);}
.page-tabs{max-width:1240px;margin:14px auto 0;display:flex;gap:4px;}
.page-tab{background:transparent;border:none;color:#C9D3DA;padding:9px 4px;margin-right:20px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;opacity:.7;}
.page-tab.active{color:#fff;opacity:1;border-bottom-color:var(--brass);}

.controls{max-width:1240px;margin:18px auto 0;padding:0 clamp(16px,4vw,48px);display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1 1 200px;max-width:300px;}
.search-wrap input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);font-size:13px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.55;}
.dd{padding:9px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);font-size:13px;min-width:135px;}
.chip{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:3px;font-size:12px;cursor:pointer;}
.chip.active{background:var(--tag-ctl);color:#fff;border-color:var(--tag-ctl);}
.btn{font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1D1204;}
.btn.small{padding:5px 10px;font-size:11.5px;}
.btn.danger{border-color:var(--bad);color:var(--bad);}
.result-count{margin-left:auto;font-size:12px;opacity:.6;white-space:nowrap;}

main{max-width:1240px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 60px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px;}
.plaque{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:2px;padding:15px 15px 13px;cursor:pointer;text-align:left;position:relative;}
.plaque:hover{border-top-color:var(--brass-light);}
.plaque-idline{font-family:'Fraunces',serif;font-size:17.5px;font-weight:600;line-height:1.28;padding-right:70px;}
.plaque-idline .room{opacity:.9;}
.status-badge{position:absolute;top:13px;right:13px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:2px;display:flex;align-items:center;gap:4px;}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.status-online{background:rgba(75,102,80,.14);color:var(--good);}
.status-online .status-dot{background:var(--good);}
.status-offline{background:rgba(164,63,50,.14);color:var(--bad);}
.status-offline .status-dot{background:var(--bad);}
.status-none{background:rgba(138,134,114,.14);color:var(--neutral);}
.status-none .status-dot{background:var(--neutral);}
.plaque-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.tag{font-size:10.5px;border:1px solid var(--line-strong);border-radius:2px;padding:2px 6px;opacity:.75;}
.tag.ctl{color:var(--tag-ctl);border-color:var(--tag-ctl);opacity:1;}
.plaque-contacts{margin-top:10px;font-size:11.5px;opacity:.7;line-height:1.6;}
.plaque-contacts b{opacity:.85;font-weight:600;}
.empty-state{text-align:center;padding:60px 20px;opacity:.6;}

.inline-form{background:var(--card);border:1px dashed var(--line-strong);border-radius:3px;padding:16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.inline-form label{display:flex;flex-direction:column;font-size:11px;opacity:.65;gap:4px;}
.inline-form input,.inline-form select{padding:7px 9px;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);color:var(--ink);font-size:13px;min-width:140px;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:auto;}
.panel{width:min(600px,100%);height:100%;background:var(--paper);overflow-y:auto;transform:translateX(24px);transition:transform .25s;border-left:3px solid var(--brass);}
.overlay.open .panel{transform:translateX(0);}
.panel-head{background:var(--blueprint);color:#F3F1E8;padding:calc(20px + env(safe-area-inset-top,0px)) clamp(20px,3vw,32px) 18px;position:relative;}
.panel-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:18px;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;width:30px;height:30px;border-radius:3px;cursor:pointer;font-size:16px;}
.panel-idline{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1.3;padding-right:40px;}
.panel-sub{font-size:12.5px;color:#C9D3DA;margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 clamp(20px,3vw,32px);gap:4px;flex-wrap:wrap;}
.tab{background:transparent;border:none;padding:12px 4px;margin-right:16px;font-size:12.5px;font-weight:500;color:var(--ink);opacity:.55;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{opacity:1;border-bottom-color:var(--brass);}
.panel-body{padding:18px clamp(20px,3vw,32px) 40px;}
.spec-section-title{font-size:11px;letter-spacing:.03em;text-transform:uppercase;opacity:.55;margin:18px 0 9px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.spec-section-title:first-child{margin-top:0;}
.spec-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.spec-row .k{opacity:.65;flex-shrink:0;}
.spec-row .v{text-align:right;font-weight:500;}
.spec-row .v.empty{opacity:.35;font-style:italic;font-weight:400;}
.spec-row input, .spec-row select{font-size:13px;text-align:right;border:1px solid var(--line-strong);border-radius:2px;padding:5px 8px;background:var(--card);color:var(--ink);width:58%;}
.locked-note{display:flex;gap:9px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:11px 13px;font-size:12px;opacity:.75;margin:8px 0 4px;}
.save-bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line-strong);padding:14px clamp(20px,3vw,32px);display:flex;justify-content:space-between;gap:10px;}
.history-item{padding:12px 0;border-bottom:1px solid var(--line);}
.history-item .who{font-weight:600;font-size:12.5px;}
.history-item .when{font-size:11px;opacity:.55;margin-left:8px;}
.history-item .what{font-size:12.5px;margin-top:3px;opacity:.85;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:4px;}
.photo-tile{aspect-ratio:4/3;background:linear-gradient(135deg,var(--card),var(--line));border:1px solid var(--line-strong);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;opacity:.6;}

.contact-card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px 15px;}
.contact-card + .contact-card{margin-top:9px;}
.contact-role{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;opacity:.55;font-weight:600;}
.contact-name{font-family:'Fraunces',serif;font-size:17px;margin-top:3px;}
.contact-line{font-size:12.5px;opacity:.8;margin-top:2px;}

.eq-cat-block{margin-bottom:16px;}
.eq-cat-title{font-size:12px;font-weight:600;opacity:.7;margin-bottom:6px;}
.eq-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.eq-item .model{flex:1;}
.eq-item .qty{opacity:.6;font-size:12px;width:46px;}
.eq-item select.model-select{flex:1;}
.eq-item input.qty-input{width:46px;text-align:center;}
.eq-remove{background:none;border:none;color:var(--bad);cursor:pointer;font-size:15px;padding:0 4px;}
.add-eq-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.add-eq-row select,.add-eq-row input{padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);font-size:12.5px;}
.add-eq-row input.qty-input{width:52px;}

.catalog-section{margin-bottom:24px;}
.catalog-section h3{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:10px;}
.catalog-count{font-size:11px;opacity:.5;font-weight:400;font-family:'IBM Plex Sans',sans-serif;}
.catalog-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);}
.catalog-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;opacity:.55;padding:8px 11px;border-bottom:1px solid var(--line-strong);}
.catalog-table td{padding:8px 11px;font-size:12.5px;border-bottom:1px solid var(--line);}
.catalog-table tr:last-child td{border-bottom:none;}
.catalog-table input{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font-size:12.5px;padding:3px 4px;border-radius:2px;}
.catalog-table input:hover,.catalog-table input:focus{border-color:var(--line-strong);background:var(--paper);}
.catalog-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

.report-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin-bottom:16px;}
.report-card h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 12px;}
.report-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.result-tile{display:flex;gap:20px;margin-top:6px;}
.result-tile .num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;}
.result-tile .lbl{font-size:11.5px;opacity:.6;margin-top:2px;}
.lifecycle-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.lifecycle-row .yr{font-weight:600;}
.lifecycle-row .yr.stale{color:var(--bad);}

.badge-proto{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;background:var(--flag);color:#fff;font-size:10.5px;padding:6px 10px;border-radius:3px;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:250px;}
@media (max-width:640px){ .band-top{flex-direction:column;align-items:flex-start;} .result-count{margin-left:0;} }
</style>
</head>

<header class="band">
  <div class="band-top">
    <div>
      <p class="band-title">Campus Room &amp; Equipment Directory</p>
      <p class="band-sub">935 rooms &middot; AV status shown here is simulated, pending GVE integration</p>
    </div>
    <div class="mode-toggle" role="group" aria-label="View mode">
      <button id="btn-public" class="active">Public</button>
      <button id="btn-student">Student Tech</button>
      <button id="btn-editor">Staff Editor</button>
    </div>
  </div>
  <div class="page-tabs" id="page-tabs" style="display:none;">
    <button class="page-tab active" data-page="rooms">Rooms</button>
    <button class="page-tab" data-page="catalog">Equipment Catalog</button>
    <button class="page-tab" data-page="reports">Reports</button>
  </div>
</header>

<main>
  <div id="page-rooms">

        <input id="search" type="text" placeholder="Search building, room, or equipment&hellip;">
      </div>
      <select id="dd-building" class="dd"><option value="">All buildings</option></select>
      <select id="dd-room" class="dd"><option value="">All rooms</option></select>
      <button class="chip" id="ctl-toggle">CTL-supported only</button>
      <button class="btn" id="add-room-btn" style="display:none;">+ Add room</button>
      <div class="result-count" id="result-count"></div>
    </div>
    <div id="add-room-form"></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty" style="display:none;">No rooms match your search.</div>
  </div>
  <div id="page-catalog" style="display:none;"></div>
  <div id="page-reports" style="display:none;"></div>
</main>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
let mode='public', page='rooms', activeCTLOnly=false, currentRoom=null, activeTab='room';
const eqCategories = ()=>Object.keys(CATALOG).sort();
const fmt = v => (v===undefined||v===null||v==='') ? null : String(v);

const sampleHistory=[
  {who:'D. Ferris (AV Support)', when:'Mar 3, 2026', what:'Replaced projector bulb; verified touchpanel calibration.'},
  {who:'K. Osei (CTL)', when:'Nov 18, 2025', what:'Updated seating capacity from 82 to 80 after fire-code review.'},
  {who:'M. Alvarez (Dept. Contact)', when:'Aug 22, 2025', what:'Added note: podium mic intermittent, ticket #4471 filed.'}
];

/* ---------------- status helpers ---------------- */
function roomStatus(r){
  if(!r._equipment.length) return 'none';
  return r._equipment.every(e=>e.online) ? 'online' : 'offline';
}
function statusBadgeHtml(status){
  const label = status==='online' ? 'Online' : status==='offline' ? 'Offline' : 'No AV';
  return `<span class="status-badge status-${status}"><span class="status-dot"></span>${label}</span>`;
}

/* ---------------- dropdowns ---------------- */
function populateBuildingDropdown(){
  const sel=document.getElementById('dd-building');
  const cur = sel.value;
  const buildings=Array.from(new Set(ROOMS.map(r=>r.Building))).sort();
  sel.innerHTML='<option value="">All buildings</option>'+buildings.map(b=>`<option value="${b}">${b}</option>`).join('');
  sel.value = buildings.includes(cur) ? cur : '';
}
function populateRoomDropdown(building){
  const sel=document.getElementById('dd-room');
  const rooms=ROOMS.filter(r=>!building||r.Building===building).sort((a,b)=>a.Room.localeCompare(b.Room,undefined,{numeric:true}));
  sel.innerHTML='<option value="">All rooms</option>'+rooms.map(r=>`<option value="${r.Building}||${r.Room}">${r.Room}</option>`).join('');
}
document.getElementById('dd-building').addEventListener('change', e=>{ populateRoomDropdown(e.target.value); renderGrid(); });
document.getElementById('dd-room').addEventListener('change', e=>{
  if(!e.target.value) return;
  const [b,room]=e.target.value.split('||');
  const found=ROOMS.find(r=>r.Building===b && r.Room===room);
  if(found) openPanel(found);
});
document.getElementById('ctl-toggle').addEventListener('click', ()=>{
  activeCTLOnly=!activeCTLOnly;
  document.getElementById('ctl-toggle').classList.toggle('active', activeCTLOnly);
  renderGrid();
});
document.getElementById('search').addEventListener('input', renderGrid);

/* ---------------- grid ---------------- */
function matchesSearch(r,q){
  if(!q) return true;
  q=q.toLowerCase();
  const eqHay = r._equipment.map(e=>e.model).join(' ');
  const hay=[r.Building,r.Room,r['Room Type'],r.Department,r.College,eqHay].join(' ').toLowerCase();
  return hay.includes(q);
}
function renderGrid(){
  const q=document.getElementById('search').value.trim();
  const buildingSel=document.getElementById('dd-building').value;
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  grid.innerHTML='';
  const filtered=ROOMS.filter(r=>matchesSearch(r,q) && (!buildingSel||r.Building===buildingSel) && (!activeCTLOnly||r._ctl_supported));
  document.getElementById('result-count').textContent=filtered.length+' room'+(filtered.length===1?'':'s');
  empty.style.display=filtered.length===0?'block':'none';

  filtered.forEach(r=>{
    const status = roomStatus(r);
    const av = r._contacts['AV Support'];
    const comp = r._contacts['Computer Support'];
    const card=document.createElement('button');
    card.className='plaque';
    card.innerHTML=`
      ${statusBadgeHtml(status)}
      <div class="plaque-idline">${r.Building}<br><span class="room">${r.Room}</span></div>
      <div class="plaque-tags">
        ${r.Zone && r.Zone!=='\u2014' ? `<span class="tag">${r.Zone} zone</span>` : ''}
        ${r._ctl_supported ? '<span class="tag ctl">CTL</span>' : ''}
      </div>
      <div class="plaque-contacts">
        ${av ? `<div><b>AV:</b> ${av.name}</div>` : ''}
        ${comp ? `<div><b>Computer:</b> ${comp.name}</div>` : ''}
      </div>`;
    card.onclick=()=>openPanel(r);
    grid.appendChild(card);
  });
}

/* ---------------- add / decommission room ---------------- */
document.getElementById('add-room-btn').addEventListener('click', ()=>{
  const wrap = document.getElementById('add-room-form');
  if(wrap.innerHTML){ wrap.innerHTML=''; return; }
  const buildings = Array.from(new Set(ROOMS.map(r=>r.Building))).sort();
  wrap.innerHTML = `
    <div class="inline-form">
      <label>Building
        <input list="building-list" id="new-building" placeholder="Existing or new building">
        <datalist id="building-list">${buildings.map(b=>`<option value="${b}">`).join('')}</datalist>
      </label>
      <label>Room number<input id="new-room" placeholder="e.g. 214"></label>
      <label>Room type<input id="new-type" placeholder="e.g. Classroom"></label>
      <label>Zone<input id="new-zone" placeholder="e.g. North"></label>
      <button class="btn primary small" id="create-room-btn">Create room</button>
      <button class="btn small" id="cancel-room-btn">Cancel</button>
    </div>`;
  document.getElementById('cancel-room-btn').onclick = ()=>{ wrap.innerHTML=''; };
  document.getElementById('create-room-btn').onclick = ()=>{
    const b = document.getElementById('new-building').value.trim();
    const rm = document.getElementById('new-room').value.trim();
    if(!b || !rm){ alert('Building and room number are required.'); return; }
    ROOMS.push({
      Building:b, Room:rm, 'Room Type':document.getElementById('new-type').value.trim(),
      Department:'', College:'', 'Primary Support Unit':'', Zone:document.getElementById('new-zone').value.trim()||'\u2014',
      _ctl_supported:false, 'Seating Capacity':'', 'Room Square Footage':'', 'Seating Configuration':'', 'Floor Type':'',
      Notes:'New room \u2014 added via prototype demo.', 'Latest Update':'', 'Last Update Year':null,
      _equipment:[], _room_online:true, _photo_count:0,
      _contacts:{'CTL Support':null,'AV Support':null,'Department Contact':null,'Computer Support':null}
    });
    wrap.innerHTML='';
    populateBuildingDropdown(); populateRoomDropdown(document.getElementById('dd-building').value); renderGrid();
  };
});

/* ---------------- panel: room & contacts tab ---------------- */
function locationFieldsHtml(room, editable){
  const rows = [
    ['Building','Building',false],['Room','Room',false],['Room type','Room Type',true],
    ['Department','Department',true],['College','College',true],['Zone','Zone',true],
    ['Seating capacity','Seating Capacity',true],['Square footage','Room Square Footage',true],
    ['Seating configuration','Seating Configuration',true],['Floor type','Floor Type',true],
    ['Notes','Notes',true],['Latest update','Latest Update',true]
  ];
  let html='<div class="spec-section-title">Room</div>';
  rows.forEach(([label,key,ed])=>{
    const val=fmt(room[key]);
    if(editable && ed){
      html += `<div class="spec-row"><span class="k">${label}</span><input data-key="${key}" value="${val?val.replace(/"/g,'&quot;'):''}" placeholder="&mdash;"></div>`;
    } else {
      html += `<div class="spec-row"><span class="k">${label}</span><span class="v ${val?'':'empty'}">${val?val:'Not recorded'}</span></div>`;
    }
  });
  return html;
}
function contactsHtml(room, editable){
  const roles=['CTL Support','AV Support','Department Contact','Computer Support'];
  let html = '<div class="spec-section-title">Support contacts</div>';
  let any=false;
  roles.forEach(role=>{
    const c=room._contacts[role];
    if(!c && !editable) return;
    any=true;
    if(editable){
      html += `<div class="contact-card"><div class="contact-role">${role}</div>
        <div class="spec-row" style="border:none;padding:5px 0;"><span class="k">Name</span><input value="${c?c.name:''}" placeholder="&mdash;"></div>
        <div class="spec-row" style="border:none;padding:5px 0;"><span class="k">Email</span><input value="${c?c.email:''}" placeholder="&mdash;"></div>
        <div class="spec-row" style="border:none;padding:5px 0;"><span class="k">Phone</span><input value="${c?c.phone:''}" placeholder="&mdash;"></div>
      </div>`;
    } else {
      html += `<div class="contact-card"><div class="contact-role">${role}</div>
        <div class="contact-name">${c.name}</div><div class="contact-line">${c.email}</div><div class="contact-line">${c.phone}</div></div>`;
    }
  });
  if(!any) html += `<div class="locked-note">No support contacts on file for this room yet.</div>`;
  return html;
}

/* ---------------- panel: equipment tab ---------------- */
function equipmentTabHtml(room, editable){
  let html = `<div class="locked-note"><span>&#128225;</span><span>Online/offline status shown per item is simulated for this prototype. Once connected, this will pull live from GVE.</span></div>`;
  const grouped = {};
  room._equipment.forEach((e,i)=>{ (grouped[e.category] = grouped[e.category]||[]).push({...e, _idx:i}); });
  const cats = Object.keys(grouped).sort();
  if(cats.length===0 && !editable) html += `<div class="locked-note">No equipment on file for this room.</div>`;
  cats.forEach(cat=>{
    html += `<div class="eq-cat-block"><div class="eq-cat-title">${cat}</div>`;
    grouped[cat].forEach(e=>{
      if(editable){
        const options=(CATALOG[cat]||[]).map(i=>i.model);
        if(!options.includes(e.model)) options.unshift(e.model);
        html += `<div class="eq-item">
          <select class="model-select" data-idx="${e._idx}">${options.map(o=>`<option ${o===e.model?'selected':''}>${o}</option>`).join('')}</select>
          <input class="qty-input" data-idx="${e._idx}" type="number" min="1" value="${e.qty}">
          <button class="eq-remove" data-remove="${e._idx}" title="Remove">&times;</button>
        </div>`;
      } else {
        html += `<div class="eq-item">
          <span class="model">${e.model}</span>
          <span class="qty">&times;${e.qty}</span>
          ${statusBadgeHtml(e.online?'online':'offline')}
        </div>`;
      }
    });
    html += `</div>`;
  });
  if(editable){
    const catOpts = eqCategories().map(c=>`<option value="${c}">${c}</option>`).join('');
    html += `<div class="add-eq-row">
      <select id="add-eq-cat">${catOpts}</select>
      <select id="add-eq-model"></select>
      <input id="add-eq-qty" class="qty-input" type="number" min="1" value="1">
      <button class="btn small" id="add-eq-btn">+ Add equipment</button>
    </div>`;
  }
  return html;
}
function wireEquipmentTab(){
  const catSel = document.getElementById('add-eq-cat');
  const modelSel = document.getElementById('add-eq-model');
  if(!catSel) return;
  function refreshModels(){
    const models = (CATALOG[catSel.value]||[]).map(i=>i.model);
    modelSel.innerHTML = models.map(m=>`<option>${m}</option>`).join('');
  }
  catSel.onchange = refreshModels;
  refreshModels();
  document.getElementById('add-eq-btn').onclick = ()=>{
    currentRoom._equipment.push({category:catSel.value, model:modelSel.value, qty:parseInt(document.getElementById('add-eq-qty').value)||1, online:true});
    renderPanelBody();
  };
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = ()=>{ currentRoom._equipment.splice(parseInt(btn.dataset.remove),1); renderPanelBody(); };
  });
}

/* ---------------- photos / history ---------------- */
function photosHtml(room){
  let tiles=''; for(let i=1;i<=room._photo_count;i++){ tiles+=`<div class="photo-tile">&#128247;<span>Photo ${i}</span></div>`; }
  return `<div class="locked-note"><span>&#128444;&#65039;</span><span>${room._photo_count} placeholder photos &mdash; real images will pull from wherever storage is decided (currently OneDrive).</span></div><div class="photo-grid">${tiles}</div>`;
}
function historyHtml(){
  let html='';
  sampleHistory.forEach(h=>{ html+=`<div class="history-item"><span class="who">${h.who}</span><span class="when">${h.when}</span><div class="what">${h.what}</div></div>`; });
  html += `<div class="locked-note"><span>&#128203;</span><span>Sample history for design purposes. In the real app every edit logs automatically &mdash; who, when, and exactly what changed.</span></div>`;
  return html;
}

/* ---------------- panel orchestration ---------------- */
function tabsForMode(){
  if(mode==='public') return [['room','Room & support contacts'],['equipment','Equipment list'],['photos','Photos']];
  if(mode==='editor') return [['room','Room & support contacts'],['equipment','Equipment list'],['photos','Photos'],['history','History']];
  return [];
}
function renderPanelBody(){
  const body=document.querySelector('.panel-body');
  const editable = mode==='editor';
  if(mode==='student'){ body.innerHTML = contactsHtml(currentRoom,false); return; }
  if(activeTab==='room'){
    body.innerHTML = locationFieldsHtml(currentRoom,editable) + contactsHtml(currentRoom,editable);
  } else if(activeTab==='equipment'){
    body.innerHTML = equipmentTabHtml(currentRoom, editable);
    wireEquipmentTab();
  } else if(activeTab==='photos'){
    body.innerHTML = photosHtml(currentRoom);
  } else if(activeTab==='history'){
    body.innerHTML = historyHtml();
  }
}
function openPanel(room){
  currentRoom=room; activeTab='room';
  const panel=document.getElementById('panel');
  const editable = mode==='editor';
  const tabs=tabsForMode();
  const status = roomStatus(room);
  panel.innerHTML=`
    <div class="panel-head">
      <button class="panel-close" id="panel-close" aria-label="Close">&times;</button>
      <div class="panel-idline">${room.Building}<br>${room.Room}</div>
      <div class="panel-sub">${room.Department?room.Department+' &middot; ':''}${room.Zone&&room.Zone!=='\u2014'?room.Zone+' zone &middot; ':''}${statusBadgeHtml(status)}</div>
    </div>
    ${tabs.length?`<div class="tabs">${tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`:''}
    <div class="panel-body"></div>
    ${editable?`<div class="save-bar"><button class="btn danger" id="decommission-btn">Decommission room</button><span style="display:flex;gap:10px;"><button class="btn" id="cancel-btn">Cancel</button><button class="btn primary" id="save-btn">Save changes</button></span></div>`:''}
  `;
  renderPanelBody();
  document.getElementById('panel-close').onclick = closePanel;
  panel.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{ activeTab=t.dataset.tab; panel.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); renderPanelBody(); };
  });
  if(editable){
    document.getElementById('save-btn').onclick = ()=>{
      const btn=document.getElementById('save-btn'); btn.textContent='Saved \u2713';
      setTimeout(()=>{ btn.textContent='Save changes'; },1400);
    };
    document.getElementById('cancel-btn').onclick = closePanel;
    document.getElementById('decommission-btn').onclick = ()=>{
      if(confirm(`Decommission ${room.Building} ${room.Room}? This removes it from the directory.`)){
        const idx = ROOMS.indexOf(room);
        if(idx>-1) ROOMS.splice(idx,1);
        closePanel(); populateBuildingDropdown(); populateRoomDropdown(''); renderGrid();
      }
    };
  }
  document.getElementById('overlay').classList.add('open');
}
function closePanel(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closePanel(); });

/* ---------------- catalog page ---------------- */
function renderCatalogPage(){
  const el=document.getElementById('page-catalog');
  let html = `<div class="catalog-header-row">
      <div class="locked-note" style="margin:0;flex:1;"><span>&#128193;</span><span>Add models here, then pick them from a dropdown when editing a room's equipment list. Prices shown are placeholders for this prototype.</span></div>
      <button class="btn small" id="add-cat-btn" style="margin-left:14px;">+ Add category</button>
    </div>
    <div id="new-cat-form"></div>`;
  Object.keys(CATALOG).sort().forEach(cat=>{
    const items=CATALOG[cat];
    html += `<div class="catalog-section">
      <h3>${cat} <span class="catalog-count">${items.length} model${items.length===1?'':'s'}</span></h3>
      <table class="catalog-table">
        <thead><tr><th>Model</th><th style="width:130px;">Last price paid</th></tr></thead>
        <tbody>${items.map(i=>`<tr><td><input value="${i.model.replace(/"/g,'&quot;')}"></td><td><input value="$${i.last_price.toLocaleString()}"></td></tr>`).join('')}</tbody>
      </table>
      <button class="btn small" style="margin-top:8px;" data-add-model="${cat}">+ Add model</button>
    </div>`;
  });
  el.innerHTML = html;
  document.getElementById('add-cat-btn').onclick = ()=>{
    const wrap = document.getElementById('new-cat-form');
    if(wrap.innerHTML){ wrap.innerHTML=''; return; }
    wrap.innerHTML = `<div class="inline-form">
      <label>New category name<input id="new-cat-name" placeholder="e.g. Wireless Presentation Hub"></label>
      <button class="btn primary small" id="create-cat-btn">Create category</button>
      <button class="btn small" id="cancel-cat-btn">Cancel</button>
    </div>`;
    document.getElementById('cancel-cat-btn').onclick = ()=>{ wrap.innerHTML=''; };
    document.getElementById('create-cat-btn').onclick = ()=>{
      const name = document.getElementById('new-cat-name').value.trim();
      if(!name){ return; }
      if(!CATALOG[name]) CATALOG[name] = [];
      renderCatalogPage();
    };
  };
  document.querySelectorAll('[data-add-model]').forEach(btn=>{
    btn.onclick = ()=>{
      const cat = btn.dataset.addModel;
      const name = prompt('New model name for "'+cat+'":');
      if(!name) return;
      CATALOG[cat].push({model:name, last_price:0});
      renderCatalogPage();
    };
  });
}

/* ---------------- reports page ---------------- */
function renderReportsPage(){
  const el=document.getElementById('page-reports');
  el.innerHTML = `
    <div class="report-card">
      <h4>Equipment lookup</h4>
      <div class="report-controls">
        <select id="rep-cat" class="dd"></select>
        <select id="rep-model" class="dd"></select>
      </div>
      <div id="rep-result"></div>
    </div>
    <div class="report-card">
      <h4>Lifecycle refresh candidates</h4>
      <div class="report-controls">
        <label style="font-size:12.5px;opacity:.75;display:flex;align-items:center;gap:8px;">Flag rooms not updated since before
          <input id="rep-year" type="number" value="2020" style="width:80px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--card);color:var(--ink);">
        </label>
      </div>
      <div id="rep-lifecycle"></div>
    </div>
  `;
  const catSel=document.getElementById('rep-cat');
  catSel.innerHTML = eqCategories().map(c=>`<option>${c}</option>`).join('');
  function refreshModelSel(){
    const modelSel=document.getElementById('rep-model');
    modelSel.innerHTML = (CATALOG[catSel.value]||[]).map(i=>`<option>${i.model}</option>`).join('');
    refreshResult();
  }
  function refreshResult(){
    const cat=catSel.value, model=document.getElementById('rep-model').value;
    let ctlCount=0, nonCtlCount=0;
    ROOMS.forEach(r=>{
      r._equipment.forEach(e=>{
        if(e.category===cat && e.model===model){
          if(r._ctl_supported) ctlCount += e.qty; else nonCtlCount += e.qty;
        }
      });
    });
    document.getElementById('rep-result').innerHTML = `
      <div class="result-tile">
        <div><div class="num">${ctlCount}</div><div class="lbl">in CTL-supported rooms</div></div>
        <div><div class="num">${nonCtlCount}</div><div class="lbl">in non-CTL rooms</div></div>
        <div><div class="num">${ctlCount+nonCtlCount}</div><div class="lbl">total (sample data)</div></div>
      </div>`;
  }
  catSel.onchange = refreshModelSel;
  document.getElementById('rep-model').onchange = refreshResult;
  refreshModelSel();

  function refreshLifecycle(){
    const threshold = parseInt(document.getElementById('rep-year').value)||0;
    const withYear = ROOMS.filter(r=>r['Last Update Year']).sort((a,b)=>a['Last Update Year']-b['Last Update Year']);
    let html = withYear.slice(0,12).map(r=>`
      <div class="lifecycle-row"><span>${r.Building} &middot; ${r.Room}</span>
        <span class="yr ${r['Last Update Year']<threshold?'stale':''}">${r['Last Update Year']}</span></div>`).join('');
    if(!html) html = '<div class="locked-note">No install-year data in this sample.</div>';
    document.getElementById('rep-lifecycle').innerHTML = html + `<div class="locked-note" style="margin-top:12px;"><span>&#128197;</span><span>Showing the 12 oldest installs in this sample (full dataset would show more). Rows in red were last updated before your threshold year.</span></div>`;
  }
  document.getElementById('rep-year').oninput = refreshLifecycle;
  refreshLifecycle();
}

/* ---------------- mode & page switching ---------------- */
function setMode(m){
  mode=m;
  ['public','student','editor'].forEach(x=>document.getElementById('btn-'+x).classList.toggle('active', x===m));
  document.getElementById('page-tabs').style.display = m==='editor' ? 'flex' : 'none';
  document.getElementById('add-room-btn').style.display = m==='editor' ? 'inline-block' : 'none';
  if(m!=='editor'){ setPage('rooms'); document.getElementById('add-room-form').innerHTML=''; }
  if(currentRoom && document.getElementById('overlay').classList.contains('open')) openPanel(currentRoom);
  renderGrid();
}
function setPage(p){
  page=p;
  document.querySelectorAll('.page-tab').forEach(t=>t.classList.toggle('active', t.dataset.page===p));
  document.getElementById('page-rooms').style.display = p==='rooms'?'block':'none';
  document.getElementById('page-catalog').style.display = p==='catalog'?'block':'none';
  document.getElementById('page-reports').style.display = p==='reports'?'block':'none';
  if(p==='catalog') renderCatalogPage();
  if(p==='reports') renderReportsPage();
}
document.getElementById('btn-public').onclick=()=>setMode('public');
document.getElementById('btn-student').onclick=()=>setMode('student');
document.getElementById('btn-editor').onclick=()=>setMode('editor');
document.querySelectorAll('.page-tab').forEach(t=>t.onclick=()=>setPage(t.dataset.page));

/* ---------------- init ---------------- */
populateBuildingDropdown();
populateRoomDropdown('');
renderGrid();
</script>
</body>
</html>
